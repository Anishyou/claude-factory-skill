<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
    <style>
      .agent { fill: #f5f0ff; stroke: #8250df; stroke-width: 1.5; }
      .hook  { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.5; }
      .human { fill: #e9f7ec; stroke: #1a7f37; stroke-width: 1.5; }
      .io    { fill: #eef4ff; stroke: #0969da; stroke-width: 1.5; }
      .t  { font-size: 14px; font-weight: 600; fill: #1f2328; text-anchor: middle; }
      .s  { font-size: 11.5px; fill: #57606a; text-anchor: middle; }
      .l  { font-size: 11.5px; font-weight: 600; }
      .ln { stroke: #57606a; stroke-width: 1.6; fill: none; marker-end: url(#a); }
      .red { stroke: #cf222e; stroke-width: 1.6; fill: none; marker-end: url(#r); }
      .grn { stroke: #1a7f37; stroke-width: 1.6; fill: none; marker-end: url(#g); }
    </style>
  </defs>

  <rect x="0" y="0" width="1180" height="560" rx="14" fill="#ffffff"/>

  <!-- Planning row -->
  <text x="40" y="34" style="font-size:12px;font-weight:700;fill:#57606a;letter-spacing:1px">ONCE PER PROJECT</text>
  <rect class="io" x="40" y="48" width="120" height="52" rx="26"/>
  <text class="t" x="100" y="79">Product brief</text>

  <rect class="agent" x="200" y="48" width="150" height="52" rx="8"/>
  <text class="t" x="275" y="70">/factory init</text>
  <text class="s" x="275" y="88">stack interview with you</text>

  <rect class="agent" x="390" y="48" width="150" height="52" rx="8"/>
  <text class="t" x="465" y="70">planner</text>
  <text class="s" x="465" y="88">roadmap + backlog</text>

  <rect class="agent" x="580" y="48" width="150" height="52" rx="8"/>
  <text class="t" x="655" y="70">designer</text>
  <text class="s" x="655" y="88">static mockups</text>

  <rect class="human" x="770" y="48" width="170" height="52" rx="26"/>
  <text class="t" x="855" y="70">You approve</text>
  <text class="s" x="855" y="88">the screens</text>

  <path class="ln" d="M160,74 H198"/>
  <path class="ln" d="M350,74 H388"/>
  <path class="ln" d="M540,74 H578"/>
  <path class="ln" d="M730,74 H768"/>

  <!-- Job frame -->
  <rect x="20" y="140" width="1000" height="270" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-dasharray="6 4"/>
  <text x="40" y="164" style="font-size:12px;font-weight:700;fill:#57606a;letter-spacing:1px">/FACTORY NEXT · ONE JOB · ITS OWN BRANCH AND GIT WORKTREE</text>

  <!-- approve → spec -->
  <path class="ln" d="M855,100 V120 H100 V226"/>
  <text class="l" x="110" y="134" fill="#57606a">next backlog item</text>

  <rect class="agent" x="40" y="228" width="120" height="56" rx="8"/>
  <text class="t" x="100" y="252">spec-writer</text>
  <text class="s" x="100" y="270">acceptance criteria</text>

  <rect class="agent" x="190" y="228" width="120" height="56" rx="8"/>
  <text class="t" x="250" y="252">test-writer</text>
  <text class="s" x="250" y="270">failing tests first</text>

  <rect class="agent" x="340" y="228" width="120" height="56" rx="8"/>
  <text class="t" x="400" y="252">builder</text>
  <text class="s" x="400" y="270">makes them pass</text>

  <rect class="hook" x="490" y="228" width="120" height="56" rx="8"/>
  <text class="t" x="550" y="252">gate hook</text>
  <text class="s" x="550" y="270">lint·types·test·build</text>

  <!-- reviewers -->
  <rect x="640" y="186" width="140" height="140" rx="10" fill="#ffffff" stroke="#8250df" stroke-width="1.5"/>
  <text class="s" x="710" y="204" style="font-weight:600">4 reviewers, parallel</text>
  <rect class="agent" x="652" y="212" width="116" height="22" rx="11"/><text class="s" x="710" y="227" style="fill:#1f2328">security · opus</text>
  <rect class="agent" x="652" y="239" width="116" height="22" rx="11"/><text class="s" x="710" y="254" style="fill:#1f2328">ux · sonnet</text>
  <rect class="agent" x="652" y="266" width="116" height="22" rx="11"/><text class="s" x="710" y="281" style="fill:#1f2328">ui · sonnet</text>
  <rect class="agent" x="652" y="293" width="116" height="22" rx="11"/><text class="s" x="710" y="308" style="fill:#1f2328">code · sonnet</text>

  <rect class="agent" x="830" y="228" width="160" height="56" rx="8"/>
  <text class="t" x="910" y="252">approver</text>
  <text class="s" x="910" y="270">checks every criterion</text>

  <path class="ln" d="M160,256 H188"/>
  <path class="ln" d="M310,256 H338"/>
  <path class="ln" d="M460,256 H488"/>
  <path class="grn" d="M610,256 H638"/>
  <text class="l" x="624" y="244" fill="#1a7f37" text-anchor="middle" style="font-size:10.5px">green</text>
  <path class="grn" d="M780,256 H828"/>
  <text class="l" x="804" y="244" fill="#1a7f37" text-anchor="middle" style="font-size:10.5px">all PASS</text>

  <!-- gate red loop -->
  <path class="red" d="M550,228 C550,190 400,190 400,226"/>
  <text class="l" x="475" y="186" fill="#cf222e" text-anchor="middle">red: keep working</text>

  <!-- reviewers CHANGES loop -->
  <path class="red" d="M710,326 V372 H400 V286"/>
  <text class="l" x="555" y="390" fill="#cf222e" text-anchor="middle">any CHANGES: resume the same builder (max 2×)</text>

  <!-- escalate -->
  <rect class="human" x="1055" y="230" width="112" height="52" rx="26"/>
  <text class="t" x="1112" y="253">Needs you</text>
  <text class="s" x="1112" y="270">escalated</text>
  <path class="ln" d="M990,256 H1053"/>
  <text class="l" x="1022" y="244" fill="#57606a" text-anchor="middle" style="font-size:10.5px">escalate</text>

  <!-- bottom row -->
  <rect class="io" x="830" y="460" width="160" height="56" rx="8"/>
  <text class="t" x="910" y="484">Pull request</text>
  <text class="s" x="910" y="502">job record in the body</text>
  <path class="grn" d="M910,284 V458"/>
  <text class="l" x="918" y="440" fill="#1a7f37">APPROVE</text>

  <rect class="human" x="620" y="460" width="160" height="56" rx="28"/>
  <text class="t" x="700" y="484">You merge</text>
  <text class="s" x="700" y="502">branch protection + CI</text>
  <path class="ln" d="M830,488 H782"/>

  <rect class="agent" x="390" y="460" width="180" height="56" rx="8"/>
  <text class="t" x="480" y="484">verifier</text>
  <text class="s" x="480" y="502">whole brief → coverage.md</text>
  <path class="ln" d="M620,488 H572"/>
  <text class="s" x="595" y="532">after a milestone</text>

  <!-- gaps back to planner -->
  <path class="ln" d="M390,488 H8 V20 H465 V46"/>
  <text class="l" x="200" y="480" fill="#57606a" text-anchor="middle">gaps become new backlog items</text>

  <!-- legend -->
  <g transform="translate(1040,440)">
    <rect class="agent" x="0" y="0" width="14" height="14" rx="3"/><text x="22" y="12" style="font-size:11.5px;fill:#57606a">agent</text>
    <rect class="hook" x="0" y="22" width="14" height="14" rx="3"/><text x="22" y="34" style="font-size:11.5px;fill:#57606a">hook</text>
    <rect class="human" x="0" y="44" width="14" height="14" rx="7"/><text x="22" y="56" style="font-size:11.5px;fill:#57606a">you</text>
  </g>
</svg>
